<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>居中胶囊 · 精选作品分类</title><link rel="stylesheet" href="candidate.css"><script defer src="vendor/alpine.min.js"></script></head><body data-variant="a"><main class="work-shell" x-data="{category:new URLSearchParams(location.search).get('state')||'all',image:'img/pinyiye-editor.png'}"><section aria-labelledby="work-title"><div class="work-heading"><h1 id="work-title" class="section-title">精选作品</h1><nav class="categories" aria-label="作品分类"><span class="indicator" :style="{transform:'translateX(' + ({all:0,games:100,mini:200}[category]) + '%)'}" aria-hidden="true"></span><button type="button" @click="category='all'" :aria-pressed="category==='all'" aria-pressed="true"><span>全部</span><span class="count">4</span></button><button type="button" @click="category='games'" :aria-pressed="category==='games'" aria-pressed="false"><span>游戏</span><span class="count">3</span></button><button type="button" @click="category='mini'" :aria-pressed="category==='mini'" aria-pressed="false"><span>小程序</span><span class="count">1</span></button></nav></div><span class="sr-only" aria-live="polite" x-text="'当前显示'+({all:4,games:3,mini:1}[category])+'件作品'">当前显示4件作品</span>
<div class="products">
<article id="pinyiye" class="product product-pinyiye" x-show="category==='all'||category==='mini'" x-transition:enter="filter-enter" x-transition:enter-start="filter-enter-start" x-transition:enter-end="filter-enter-end">
<button class="artwork" aria-label="预览拼一页产品图" @click="image=$event.currentTarget.querySelector('img').src;$refs.preview.showModal()"><span class="print one"><img src="img/pinyiye-weekend.jpg" alt=""></span><span class="print two"><img src="img/pinyiye-sunshine.jpg" alt=""></span><span class="pinyiye-phone"><img src="img/pinyiye-editor.png" alt="拼一页编辑器"></span></button>
<div class="info"><div class="brand"><img src="img/pinyiye-icon.png" alt=""><h3>拼一页</h3></div><p class="description">调整照片、添加文字，把生活片段拼成一张完整图片。</p><div class="meta"><span>小程序 · 微信</span><span class="status">审核中</span></div></div>
</article>
<article id="youcanup" class="product product-youcanup" x-show="category==='all'||category==='games'" x-transition:enter="filter-enter" x-transition:enter-start="filter-enter-start" x-transition:enter-end="filter-enter-end">
<button class="artwork" aria-label="预览你行你上啊产品图" @click="image=$event.currentTarget.querySelector('img').src;$refs.preview.showModal()"><span class="youcanup-screen gameplay"><img src="img/youcanup-gameplay.png" alt="你行你上啊实机"></span><span class="youcanup-screen menu"><img src="img/youcanup-menu.png" alt="你行你上啊菜单"></span></button>
<div class="info"><div class="brand"><img src="img/youcanup-icon.png" alt=""><h3>你行你上啊</h3></div><p class="description">按住蓄力，松手起跳，在软陶世界里挑战自己的最高纪录。</p><div class="meta"><span>游戏 · iOS</span><span class="status">即将推出</span></div></div>
</article>
<article id="minimalist-breakout" class="product product-game product-breakout" x-show="category==='all'||category==='games'" x-transition:enter="filter-enter" x-transition:enter-start="filter-enter-start" x-transition:enter-end="filter-enter-end">
<button class="artwork" aria-label="预览 Minimalist Breakout 产品图" @click="image=$event.currentTarget.querySelector('img').src;$refs.preview.showModal()"><span class="phone-art"><img src="img/game-artwork.png" alt="Minimalist Breakout 游戏画面"></span></button>
<div class="info"><h3>Minimalist Breakout</h3><p class="description">极简打砖块，专注每一次反弹。</p><div class="meta"><span>游戏 · iOS</span><span class="status">已上线</span></div><span class="store" aria-label="Minimalist Breakout 的真实 App Store 下载入口样式"><svg viewBox="0 0 24 28" fill="currentColor" aria-hidden="true"><path d="M19.65 14.73c.03 4.02 3.53 5.36 3.57 5.38-.03.09-.56 1.92-1.84 3.81-1.11 1.64-2.27 3.27-4.09 3.3-1.79.04-2.37-1.07-4.42-1.07-2.05 0-2.69 1.04-4.39 1.11-1.75.07-3.09-1.78-4.21-3.41C1.98 20.5.01 14.45 2.37 10.36c1.17-2.03 3.26-3.31 5.53-3.35 1.72-.03 3.34 1.18 4.4 1.18 1.05 0 3.02-1.46 5.09-1.25.87.04 3.32.35 4.89 2.65-.13.08-2.92 1.7-2.89 5.14h.26ZM16.23 4.68c.93-1.12 1.56-2.68 1.39-4.24-1.34.05-2.96.89-3.92 2.01-.86.98-1.62 2.54-1.42 4.04 1.5.12 3.01-.76 3.95-1.81Z"/></svg><span>在 App Store<small>下载</small></span></span></div></article><article id="flappy-ball" class="product product-game product-flappy" x-show="category==='all'||category==='games'" x-transition:enter="filter-enter" x-transition:enter-start="filter-enter-start" x-transition:enter-end="filter-enter-end">
<button class="artwork" aria-label="预览 Flappy Ball Hop 产品图" @click="image=$event.currentTarget.querySelector('img').src;$refs.preview.showModal()"><span class="phone-art"><img src="img/game-artwork.png" alt="Flappy Ball Hop 游戏画面"></span></button>
<div class="info"><h3>Flappy Ball Hop</h3><p class="description">轻点跃起，穿过篮圈，收集星星。</p><div class="meta"><span>游戏</span><span class="status">即将推出</span></div></div></article>
</div></section><dialog x-ref="preview" aria-label="产品图预览" @click.self="$refs.preview.close()"><button class="close" type="button" aria-label="关闭预览" @click="$refs.preview.close()">×</button><img src="img/pinyiye-editor.png" :src="image" alt="产品图片大图"></dialog></main></body></html>
